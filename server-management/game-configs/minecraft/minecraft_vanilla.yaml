services:
  minecraft:
    image: itzg/minecraft-server:${JAVA_VERSION:-java21}
    container_name: ${SERVER_NAME:-minecraft_vanilla}
    ports:
      - "${GAME_PORT:-25565}:25565"
    environment:
      EULA: "TRUE"
      VERSION: "${MC_VERSION:-1.21.8}"
      TYPE: "${SERVER_TYPE:-PAPER}"
      MEMORY: "${MEMORY:-4G}"
    volumes:
      - "/mnt/detach/minecraft/data/${SERVER_NAME:-minecraft_vanilla}:/data"
    restart: unless-stopped
