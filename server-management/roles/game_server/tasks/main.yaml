---
- name: Determine requested game
  ansible.builtin.set_fact:
    effective_game_type: "{{ selected_game | default(game_type, true) }}"

- name: Validate selected game
  ansible.builtin.assert:
    that:
      - effective_game_type in game_configs
      - server_action in compose_states
    fail_msg: >-
      Game must be one of {{ game_configs.keys() | list | join(', ') }},
      and action must be one of deploy, stop, start, restart, or remove.

- name: Select game configuration
  ansible.builtin.set_fact:
    selected_game_config: "{{ game_configs[effective_game_type] }}"

- name: Set server project directory
  ansible.builtin.set_fact:
    game_project_dir: "{{ server_install_root }}/{{ server_name }}"

- name: Verify Docker is available
  ansible.builtin.command:
    cmd: docker version
  changed_when: false

- name: Verify Docker Compose is available
  ansible.builtin.command:
    cmd: docker compose version
  changed_when: false

- name: Create server project directory
  ansible.builtin.file:
    path: "{{ game_project_dir }}"
    state: directory
    mode: "0755"
  when: server_action in ["deploy", "start", "stop", "restart"]

- name: Create Terraria world directory
  ansible.builtin.file:
    path: "/mnt/detach/terraria/data/{{ server_name }}/Worlds"
    state: directory
    mode: "0755"
  when:
    - effective_game_type == "terraria"
    - server_action in ["deploy", "start", "restart"]

- name: Copy selected Compose file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/game-configs/{{ selected_game_config.compose_file }}"
    dest: "{{ game_project_dir }}/compose.yaml"
    mode: "0644"
  when: server_action in ["deploy", "start", "stop", "restart"]

- name: Convert Terraria difficulty
  ansible.builtin.set_fact:
    terraria_difficulty_id: >-
      {{ terraria_difficulty_ids[difficulty | default('classic')] }}
  when: effective_game_type == "terraria"

- name: Copy selected environment file
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/game-configs/{{ selected_game_config.env_file }}"
    dest: "{{ game_project_dir }}/.env"
    mode: "0600"
  when:
    - server_action in ["deploy", "start", "stop", "restart"]
    - selected_game_config.env_file | default('') | length > 0

- name: Set submitted server name
  ansible.builtin.lineinfile:
    path: "{{ game_project_dir }}/.env"
    regexp: "^SERVER_NAME="
    line: "SERVER_NAME={{ server_name }}"
    create: true
    mode: "0600"

- name: Set submitted server port
  ansible.builtin.lineinfile:
    path: "{{ game_project_dir }}/.env"
    regexp: "^PORT_NUMBER="
    line: "PORT_NUMBER={{ port_number }}"
    create: true
    mode: "0600"

- name: Set Terraria world name
  ansible.builtin.lineinfile:
    path: "{{ game_project_dir }}/.env"
    regexp: "^WORLD_NAME="
    line: "WORLD_NAME={{ world_name }}"
    create: true
    mode: "0600"
  when:
    - effective_game_type == "terraria"
    - world_name is defined
    - world_name | length > 0

- name: Set Terraria world size
  ansible.builtin.lineinfile:
    path: "{{ game_project_dir }}/.env"
    regexp: "^WORLD_SIZE="
    line: "WORLD_SIZE={{ world_size }}"
    create: true
    mode: "0600"
  when:
    - effective_game_type == "terraria"
    - world_size is defined

- name: Set Terraria difficulty
  ansible.builtin.lineinfile:
    path: "{{ game_project_dir }}/.env"
    regexp: "^DIFFICULTY_ID="
    line: "DIFFICULTY_ID={{ terraria_difficulty_id }}"
    create: true
    mode: "0600"
  when:
    - effective_game_type == "terraria"
    - terraria_difficulty_id is defined

- name: Set Minecraft world name
  ansible.builtin.lineinfile:
    path: "{{ game_project_dir }}/.env"
    regexp: "^LEVEL="
    line: "LEVEL={{ world_name }}"
    create: true
    mode: "0600"
  when:
    - effective_game_type == "minecraft"
    - world_name is defined
    - world_name | length > 0

- name: Create Valheim environment file
  ansible.builtin.copy:
    dest: "{{ game_project_dir }}/.env"
    mode: "0600"
    content: |
      SERVER_NAME={{ server_name }}
      WORLD_NAME={{ world_name | default('Dedicated', true) }}
      SERVER_PORT={{ port_number | default(2456, true) }}
      SERVER_PUBLIC=1
      SERVER_PASS={{ valheim_server_password }}
      VALHEIM_MODIFIER={{ valheim_modifier | default('normal', true) }}
  when:
    - effective_game_type == "valheim"
    - server_action in ["deploy", "start", "stop", "restart"]

- name: Apply requested server action
  community.docker.docker_compose_v2:
    project_src: "{{ game_project_dir }}"
    project_name: "{{ server_name }}"
    state: "{{ compose_states[server_action] }}"
    pull: missing
    wait: false
    remove_volumes: "{{ delete_volumes }}"
  register: compose_result

- name: Display action result
  ansible.builtin.debug:
    msg:
      action: "{{ server_action }}"
      game: "{{ effective_game_type }}"
      server_name: "{{ server_name }}"
      changed: "{{ compose_result.changed }}"
